<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación 3 - Listado de Usuarios</title>
    <link rel="stylesheet" href="./css/vapor.css" />
    <link rel="stylesheet" href="./css/form.css" />
    <link href="https://cdn.datatables.net/v/dt/dt-2.3.8/datatables.min.css" rel="stylesheet" crossorigin="anonymous">

    <script src="./js/jQuery v4.0.0.js"></script>
    <script src="https://cdn.datatables.net/v/dt/dt-2.3.8/datatables.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
        <div class="container-fluid">
            <div class="collapse navbar-collapse" id="navbarColor02">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="./index.html">Inicio (Data Tables)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./eval_3.html">Nuevo Usuario</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col">
                <p class="h1">Usuarios Registrados</p>
                <p class="text-muted">Listado cargado automáticamente usando la API de JSONPlaceholder y JQuery DataTables.</p>
            </div>
        </div>

        <div class="card p-4 bg-dark border-secondary shadow">
            <table id="tablaUsuariosAPI" class="table table-hover table-striped" style="width:100%">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Usuario</th>
                        <th>Email</th>
                        <th>Sitio Web</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $('#tablaUsuariosAPI').DataTable({
                "ajax": {
                    "url": "https://jsonplaceholder.typicode.com/users",
                    "dataSrc": ""
                },
                "columns": [
                    { "data": "id" },
                    { "data": "name" },
                    { "data": "username" },
                    { "data": "email" },
                    { "data": "website" }
                ],
                "language": {
                    "url": "https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
                }
            });
        });
    </script>
</body>

</html>
